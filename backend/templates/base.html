<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Biblioteca{% endblock %}</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 60rem;
        margin: 0 auto;
        padding: 1rem;
      }
      nav {
        display: flex;
        gap: 1rem;
        align-items: center;
        border-bottom: 1px solid #ccc;
        padding-bottom: 0.5rem;
      }
      nav form {
        margin-left: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        text-align: left;
        padding: 0.3rem;
        border-bottom: 1px solid #eee;
      }
      .success {
        color: green;
      }
      .error,
      .errorlist {
        color: #b00;
      }
      .search-input {
        border: 1px solid red;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="{% url 'catalog:book_list' %}">Catalogo</a>
      {% if user.is_authenticated %}
        <a href="{% url 'circulation:my_loans' %}">I miei prestiti</a>
        {% if perms.circulation.add_loan %}
          <a href="{% url 'circulation:desk' %}">Banco prestiti</a>
        {% endif %}
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <span>Ciao, {{ user.username }}</span>
          <button type="submit">Esci</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}">Accedi</a>
      {% endif %}
    </nav>
    {% for message in messages %}
      <p class="{{ message.tags }}">{{ message }}</p>
    {% endfor %}
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
