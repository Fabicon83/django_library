[project]
name = "biblioteca"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["django (>=6.1.0,<6.2.0)", "psycopg[binary] (>=3.3,<4.0)"]

[tool.poetry]
# È un'applicazione, non una libreria da pubblicare: Poetry non deve installare il progetto stesso
package-mode = false

[dependency-groups]
dev = [
    "django-extensions (>=4.1,<5.0)",
    "pydot (>=4.0.1,<5.0.0)",
    "django-debug-toolbar (>=8.0.0,<9.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "faker (>=40.41.0,<41.0.0)",
    "djlint (>=1.46.4,<2.0.0)"
]

[tool.djlint]
profile = "django"
indent = 2
max_line_length = 120
